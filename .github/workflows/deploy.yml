# Deploy automático no GitHub Pages.
# O config.js (chaves do Firebase) NÃO fica no repositório: ele é gerado na hora
# do deploy a partir do secret CINEREA_CONFIG_JS (Settings → Secrets → Actions),
# cujo conteúdo deve ser o texto completo do seu config.js local.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Testa as regras de segurança no emulador (paralelo ao deploy; falha aparece no Actions)
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # lógica de cálculo (core.js): roda sem emulador
      - run: node --test tests/core.test.mjs
      # regras de segurança: precisam do emulador do Firestore
      - run: npx firebase emulators:exec --only firestore "node --test tests/rules.test.mjs tests/flows.test.mjs"

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Testar sintaxe dos scripts antes de publicar
        run: |
          node --check app.js
          node --check core.js
          for p in catalogo pedido cotacao; do
            awk '/<script type="module">/{f=1;next}/<\/script>/{f=0}f' $p.html > /tmp/$p.mjs
            node --check /tmp/$p.mjs
          done
          node --check sw.js
      # A VERSÃO DO SERVICE WORKER É CARIMBADA AQUI, e não à mão.
      #
      # O `sw.js` só se reinstala quando o próprio arquivo muda. Com a versão
      # escrita à mão, dez publicações seguidas de `app.js` não mudavam o
      # `sw.js`, nenhum service worker novo era instalado e o aviso de "Nova
      # versão disponível" nunca aparecia — o app continuava servindo o código
      # velho e parecia que o deploy não tinha saído.
      #
      # Com o SHA do commit no lugar da versão, todo deploy gera um `sw.js`
      # diferente, e o aviso passa a funcionar como sempre foi desenhado.
      - name: Carimbar a versão do service worker
        run: |
          sed -i "s/const CACHE = '[^']*'/const CACHE = 'cinerea-${GITHUB_SHA::12}'/" sw.js
          grep -q "cinerea-${GITHUB_SHA::12}" sw.js || {
            echo "::error::Não consegui carimbar a versão no sw.js"; exit 1; }
          echo "sw.js carimbado: cinerea-${GITHUB_SHA::12}"

      - name: Gerar config.js a partir do secret
        env:
          CINEREA_CONFIG_JS: ${{ secrets.CINEREA_CONFIG_JS }}
        run: |
          if [ -z "$CINEREA_CONFIG_JS" ]; then
            echo "::error::Secret CINEREA_CONFIG_JS não configurado. Cole nele o conteúdo do seu config.js local."
            exit 1
          fi
          printf '%s' "$CINEREA_CONFIG_JS" > config.js
          # O config.js e o UNICO arquivo que este fluxo publica sem conferir, e
          # o unico capaz de derrubar a gestao inteira: uma virgula esquecida no
          # secret vira pagina em branco, sem erro visivel para ninguem.
          # Falhar aqui e infinitamente melhor que publicar quebrado.
          if ! node --check config.js; then
            echo "::error::config.js do secret CINEREA_CONFIG_JS tem erro de sintaxe — o deploy foi interrompido ANTES de publicar. Confira virgulas e aspas."
            exit 1
          fi
          # E precisa mesmo definir a configuracao: um arquivo valido porem vazio
          # passaria no --check e deixaria a gestao sem Firebase.
          if ! grep -q 'window.CINEREA_CONFIG' config.js; then
            echo "::error::config.js nao define window.CINEREA_CONFIG."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
