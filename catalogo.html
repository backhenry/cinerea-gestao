<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinérea · Catálogo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F2EFEA;--ash:#E7E3DC;--char:#1C1A17;--ember:#B5462A;--smoke:#6E6862;--line:#D8D2C8;--warm:#8A7E70}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--char);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  header{text-align:center;padding:56px 20px 36px}
  header .sym{width:52px;margin:0 auto 20px}
  header h1{font-family:'Fraunces',serif;font-weight:400;font-size:42px}
  header .tag{font-family:'Fraunces',serif;font-style:italic;color:var(--smoke);margin-top:6px}
  main{max-width:960px;margin:0 auto;padding:0 20px 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card .ph{aspect-ratio:1;background:var(--ash);display:flex;align-items:center;justify-content:center}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card .ph svg{width:56px;opacity:.4}
  .card .in{padding:16px 18px}
  .card .n{font-family:'Fraunces',serif;font-size:19px}
  .card .p{color:var(--ember);font-family:'Fraunces',serif;font-size:17px;margin-top:4px}
  .card .pd{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--char);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px}
  .card .pd:hover{border-color:var(--ember);color:var(--ember)}
  .msg{text-align:center;color:var(--smoke);font-family:'Fraunces',serif;font-style:italic;padding:60px 20px;font-size:17px}
  .wa{position:fixed;bottom:22px;right:22px;background:var(--char);color:var(--paper);text-decoration:none;padding:14px 22px;border-radius:30px;font-size:14px;box-shadow:0 8px 30px rgba(28,26,23,.25)}
  .wa:hover{background:var(--ember)}
  footer{text-align:center;color:var(--warm);font-size:12px;padding:30px 20px}
</style>
</head>
<body>
<header>
  <svg class="sym" viewBox="0 0 150 150" fill="none"><path d="M108 46 C97 31,70 28,53 42 C36 56,36 94,53 108 C70 122,97 119,108 104" stroke="#1C1A17" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="112" cy="75" r="9" fill="#B5462A"/></svg>
  <h1>Cinérea</h1>
  <div class="tag">velas &amp; objetos de gesso</div>
</header>
<main>
  <div class="msg" id="msg">Carregando o catálogo…</div>
  <div class="grid" id="grid"></div>
</main>
<footer>feito à mão · ateliê Cinérea</footer>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const PLACEHOLDER='<svg viewBox="0 0 150 150" fill="none"><path d="M108 46 C97 31,70 28,53 42 C36 56,36 94,53 108 C70 122,97 119,108 104" stroke="#1C1A17" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="112" cy="75" r="9" fill="#B5462A"/></svg>';

const msg=document.getElementById('msg'),grid=document.getElementById('grid');
const u=new URLSearchParams(location.search).get('u');
const cfg=window.CINEREA_CONFIG;

if(!u||!cfg||!cfg.apiKey||cfg.apiKey==='COLE_AQUI'){
  msg.textContent='Catálogo não encontrado.';
}else{
  try{
    const app=initializeApp(cfg);
    const snap=await getDoc(doc(getFirestore(app),'catalogo',u));
    if(!snap.exists()||!(snap.data().itens||[]).length){msg.textContent='Catálogo vazio ou não encontrado.';}
    else{
      const d=snap.data();
      msg.style.display='none';
      if(d.nome)document.querySelector('header h1').textContent=d.nome;
      const dg=String(d.whats||'').replace(/\D/g,'');
      const waNum=dg.length>=10?(dg.length>=12?dg:'55'+dg):'';
      grid.innerHTML=d.itens.map(i=>{
        const cta=waNum?`<a class="pd" href="https://wa.me/${waNum}?text=${encodeURIComponent('Olá! Quero encomendar: '+i.nome+' ('+brl(i.preco)+')')}" target="_blank" rel="noopener">Encomendar →</a>`:'';
        return `<div class="card"><div class="ph">${i.foto?`<img src="${esc(i.foto)}" alt="${esc(i.nome)}" loading="lazy" onerror="this.parentElement.innerHTML='${PLACEHOLDER.replace(/'/g,"\\'")}'">`:PLACEHOLDER}</div><div class="in"><div class="n">${esc(i.nome)}</div><div class="p">${brl(i.preco)}</div>${cta}</div></div>`;
      }).join('');
      if(waNum)document.body.insertAdjacentHTML('beforeend',`<a class="wa" href="https://wa.me/${waNum}?text=${encodeURIComponent('Olá! Vi o catálogo e quero encomendar 🕯️')}" target="_blank" rel="noopener">Encomendar pelo WhatsApp</a>`);
    }
  }catch(e){console.error(e);msg.textContent='Não foi possível carregar o catálogo agora.';}
}
</script>
</body>
</html>
